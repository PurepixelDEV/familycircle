# TEST ONLY – HTTPS reverse proxy in front of compose.yaml, used by scripts/https-proxy-test.sh.
# nginx is configured like Nginx Proxy Manager (TLS termination, WebSocket upgrade, X-Forwarded-*).
# Not part of the end-user deployment (which stays at two containers + your existing proxy).
services:
  familycircle:
    networks:
      default: { ipv4_address: 10.231.99.20 }
  db:
    networks:
      default: { ipv4_address: 10.231.99.30 }
  proxy:
    image: nginx:1.30-alpine
    depends_on:
      familycircle: { condition: service_healthy }
    ports:
      - "9443:443"
    volumes:
      # Relative to the project directory (= directory of compose.yaml, the first -f file).
      - ./deploy/test/https-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FC_TEST_CERT_DIR:?}:/certs:ro
    networks:
      default: { ipv4_address: 10.231.99.10 }

networks:
  default:
    ipam:
      config:
        - subnet: 10.231.99.0/24
